services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: school_management
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your local environment}
    ports:
      - "5432:5432"
    volumes:
      - school-management-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_management -d school_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school-management-data:
