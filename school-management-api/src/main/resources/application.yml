server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: school-management-api
  datasource:
    url: jdbc:h2:mem:school_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
    student-password: ${APP_DEMO_STUDENT_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/school_management}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
